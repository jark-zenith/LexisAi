<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing Emblem Backdrop -->
  <rect x="80" y="80" width="352" height="352" rx="72" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Inner Badge Container -->
  <rect x="86" y="86" width="340" height="340" rx="68" fill="#0f172a" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Stylized "L" Geometry -->
  <!-- Vertical stem -->
  <rect x="156" y="148" width="58" height="216" rx="20" fill="url(#primaryGrad)"/>
  <!-- Horizontal base -->
  <path d="M 156 312 L 332 312 C 345 312 356 323 356 336 C 356 349 345 364 332 364 L 176 364 C 165 364 156 355 156 344 Z" fill="url(#primaryGrad)"/>
  <rect x="156" y="306" width="200" height="58" rx="20" fill="url(#primaryGrad)"/>

  <!-- Highlight accent on L corner -->
  <path d="M 166 160 Q 166 354 166 354 L 346 354" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.6" stroke-linecap="round"/>

  <!-- AI Sparkle Icon on Top Right -->
  <g transform="translate(324, 168)">
    <path d="M 0 -38 Q 0 0 38 0 Q 0 0 0 38 Q 0 0 -38 0 Q 0 0 0 -38 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Small secondary spark -->
  <g transform="translate(254, 136) scale(0.45)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#accentGrad)"/>
  </g>
</svg>
